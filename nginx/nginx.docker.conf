# nginx/nginx.docker.conf
# Strangler Pattern para entorno Docker Compose
#
# Usa el resolver DNS de Docker (127.0.0.11) con proxy_pass por variable
# para que nginx no cachee IPs obsoletas cuando los contenedores se recrean.

server {
    listen 80;
    server_name _;

    # DNS interno de Docker: re-resuelve hostnames cada 30s
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /favicon.ico { access_log off; log_not_found off; }

    # Health de Nginx
    location /nginx-health {
        return 200 '{"status":"ok","service":"nginx"}';
        add_header Content-Type application/json;
    }

    # ── Microservicios v2 ──────────────────────────────────────

    location /api/v2/checkout/ {
        set $backend http://flask_payment:5000;
        proxy_pass         $backend;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_redirect     off;
        proxy_read_timeout 30s;
    }

    # ─── Microservicio ms-inventory ───────────────
    location /api/v2/products/ {
        set $backend http://ms_inventory:5001;
        proxy_pass         $backend;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_redirect     off;
        proxy_read_timeout 30s;
    }

    location /api/v2/inventory/ {
        set $backend http://ms_inventory:5001;
        proxy_pass         $backend;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_redirect     off;
        proxy_read_timeout 30s;
    }

    # ─── Microservicio ms-cart────────────────────
    location /api/v2/cart/ {
        set $backend http://ms_cart:5002;
        proxy_pass         $backend;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_redirect     off;
        proxy_read_timeout 30s;
    }

    location /api/v2/customers/ {
        set $backend http://ms_customers:5003;
        proxy_pass         $backend;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_redirect     off;
        proxy_read_timeout 30s;
    }

    location /api/v2/shipping/ {
        set $backend http://ms_shipping:5004;
        proxy_pass         $backend;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_redirect     off;
        proxy_read_timeout 30s;
    }

    # ── Django API (solo rutas /api y /admin) ─────────────────
    location /api/ {
        set $backend http://django_app:8000;
        proxy_pass         $backend;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_redirect     off;
        proxy_read_timeout 60s;
    }

    location /django-admin/ {
        set $backend http://django_app:8000;
        proxy_pass         $backend;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_redirect     off;
        proxy_read_timeout 60s;
    }

    # ── Frontend React (Vite en :3000) — ruta raíz ────────────
    location / {
        set $frontend http://frontend:3000;
        proxy_pass         $frontend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect     off;
        proxy_read_timeout 60s;

        # WebSocket support (Vite HMR)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}