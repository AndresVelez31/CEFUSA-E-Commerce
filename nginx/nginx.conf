# nginx/nginx.conf
# Patrón Estrangulador — CEFUSA E-Commerce
#
# Enrutamiento:
#   /api/v2/  →  Flask  (microservicio nuevo :5000)
#   /         →  Django (monolito legacy    :8000)

# ── Backends ──────────────────────────────────────────────────
upstream django_backend {
    server 127.0.0.1:8000;   # Monolito Django (legacy /api/v1/)
}

upstream flask_backend {
    server 127.0.0.1:5000;   # Microservicio Flask (nuevo /api/v2/)
}

# ── Servidor principal ────────────────────────────────────────
server {
    listen 80;
    server_name localhost;

    # Ignorar logs de favicon
    location = /favicon.ico { access_log off; log_not_found off; }

    # ── Microservicio Flask — Strangler (NUEVO) ───────────────
    # Cualquier ruta /api/v2/ va al microservicio Flask
    location /api/v2/ {
        proxy_pass         http://flask_backend;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_redirect     off;
        proxy_read_timeout 30s;
    }

    # ── Monolito Django — Legacy (/api/v1/ y todo lo demás) ──
    location / {
        proxy_pass         http://django_backend;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_redirect     off;
        proxy_read_timeout 60s;
    }
}
