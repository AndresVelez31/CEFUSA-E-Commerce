services:
  db:
    image: postgres:16-alpine
    container_name: cefusa_db
    environment:
      POSTGRES_DB: cefusa_db
      POSTGRES_USER: cefusa_user
      POSTGRES_PASSWORD: cefusa_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cefusa_user -d cefusa_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cefusa_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  django_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cefusa_django
    environment:
      DB_ENGINE: postgres
      DB_NAME: cefusa_db
      DB_USER: cefusa_user
      DB_PASSWORD: cefusa_pass
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,django_app,nginx,*"

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MS_PAYMENT_URL: http://flask_payment:5000
      MS_INVENTORY_URL: http://ms_inventory:5001
      MS_CART_URL: http://ms_cart:5002
      MS_CUSTOMERS_URL: http://ms_customers:5003
      QUICKBITE_API_URL: http://107.23.134.243
      MS_SHIPPING_URL: http://ms_shipping:5004
    ports:
      - "8000:8000"
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cefusa_celery
    command: celery -A CEFUSAECommerce worker -l info
    working_dir: /app/CEFUSAECommerce
    environment:
      DB_ENGINE: postgres
      DB_NAME: cefusa_db
      DB_USER: cefusa_user
      DB_PASSWORD: cefusa_pass
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  flask_payment:
    build:
      context: ./services/flask_payment_service
      dockerfile: Dockerfile
    container_name: cefusa_flask
    environment:
      ENV_TYPE: development
    ports:
      - "5000:5000"

  ms_inventory:
    build:
      context: ./services/flask_inventory_service
      dockerfile: Dockerfile
    container_name: cefusa_ms_inventory
    ports:
      - "5001:5001"

  ms_cart:
    build:
      context: ./services/flask_cart_service
      dockerfile: Dockerfile
    container_name: cefusa_ms_cart
    ports:
      - "5002:5002"

  nginx:
    image: nginx:1.27-alpine
    container_name: cefusa_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - django_app
      - flask_payment
      - ms_inventory
      - ms_cart
      - ms_customers
      - ms_shipping

  # ─── Frontend React (Vite) ───────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: cefusa_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      VITE_USE_NGINX: "true"
      VITE_NGINX_URL: "http://nginx"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    depends_on:
      - nginx

  # ─── Andrés: ms-customers ────────────────────────────────────
  ms_customers:
    build:
      context: ./services/flask_customers_service
      dockerfile: Dockerfile
    container_name: cefusa_ms_customers
    volumes:
      - ms_customers_data:/data
    ports:
      - "5003:5003"

  ms_shipping:
    build:
      context: ./services/flask_shipping_service
      dockerfile: Dockerfile
    container_name: cefusa_ms_shipping
    ports:
      - "5004:5004"

volumes:
  postgres_data:
  ms_customers_data: